[project]
name = "aws-platform-agent"
version = "0.1.0"
description = "Read-only AWS Platform AIOps Agent with FastAPI, a Claude-SDK-shaped runtime, and a MiniMax model adapter."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
